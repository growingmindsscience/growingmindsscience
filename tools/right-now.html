  <!-- Situation → short answer. Shared source of truth for this page. -->
  <script id="router-data" type="application/json">
  {
    "situations": [
      {
        "id": "meltdown",
        "choice": "Meltdown or tantrum",
        "hint": "Screaming, crying, hitting, going limp, or losing it.",
        "state": "Your child's nervous system is overloaded",
        "title": "Start with regulation, not reasoning.",
        "body": "A meltdown is usually a young nervous system hitting a limit — too much wanting, too little language, too much input — not a plan to misbehave. Reduce input, stay close, and wait for the body to come back down before you teach.",
        "seq": [
          "Make it safe — block harm, move breakable things, lower the audience.",
          "Regulate first — lower your voice, slow your body, fewer words, stay close.",
          "Teach after — once calmer, briefly name what happened and one next step."
        ],
        "tryLine": "I'm here. You're safe. We can wait.",
        "toolSlug": "whats-underneath-the-meltdown",
        "aiQuestion": "My toddler is having a meltdown right now — how do I help them calm down?"
      },
      {
        "id": "limit",
        "choice": "Testing a limit",
        "hint": "Pushing a \"no\", refusing, or melting down over a boundary.",
        "state": "A limit set off big feelings",
        "title": "Hold the limit and make room for the feeling.",
        "body": "A child falling apart doesn't mean the limit was wrong. Keep the boundary simple, acknowledge the feeling, and avoid adding new arguments while it is peaking. Less talking, more calm follow-through.",
        "seq": [
          "State it once, simply — one clear boundary, not a lecture.",
          "Allow the protest — the feeling is okay; the unsafe behavior is not.",
          "Follow through with your body — move closer, block, or help the transition."
        ],
        "tryLine": "You really wanted that. I won't let you hit.",
        "toolSlug": "limits-without-escalation",
        "aiQuestion": "My child is melting down because I set a limit — how do I hold it calmly?"
      },
      {
        "id": "sleep",
        "choice": "Won't sleep",
        "hint": "Fighting bedtime, waking in the night, or stalling.",
        "state": "Bedtime or night-waking is hard tonight",
        "title": "Keep it calm, brief, and a little boring.",
        "body": "Offer reassurance, check the basics, and return to the same sleep cue. One hard night is information; a repeating pattern is a map. Your steady, low-key presence is doing the work.",
        "seq": [
          "Check needs — hunger, discomfort, temperature, illness, fear.",
          "Stay boring — calm voice, dim light, minimal engagement.",
          "Return to the same cue — the routine ending you always use."
        ],
        "tryLine": "It's still nighttime. I'll help you get cozy, and then your body can rest.",
        "toolSlug": "routines-transitions-night-waking",
        "aiQuestion": "My child won't settle to sleep right now — what can I try tonight?"
      },
      {
        "id": "patience",
        "choice": "I'm losing my patience",
        "hint": "You're the one running hot, close to yelling.",
        "state": "You're the one who's activated",
        "title": "Steady yourself first — it isn't selfish.",
        "body": "Your child borrows calm from your body before they can make their own. Regulating yourself is the intervention, not a break from it. You don't have to feel calm — you just have to act a notch calmer than you feel.",
        "seq": [
          "Notice it — say to yourself: \"I'm activated.\"",
          "Buy a second — one slow breath out, unclench your jaw, drop your shoulders.",
          "Shrink the moment — make the next 60 seconds smaller, not bigger."
        ],
        "tryLine": "I'm going to take a slow breath. We're okay.",
        "toolSlug": "regulating-yourself-first",

      },
      {

        "hint": "You yelled, it went sideways, and you want to reconnect.",
        "state": "A moment already went sideways",
        "title": "Repair the connection, not the whole day.",
        "body": "Rupture is normal; repair is what keeps the relationship and your child's sense of safety intact. You can reconnect without pretending the limit disappeared — and repair works at any age, even after the fact.",
        "seq": [

          "Name it simply — no long apology, no taking away the boundary.",
          "Reconnect — offer warmth and presence; let the closeness do the work."
        ],
        "tryLine": "That was hard. I'm sorry I got loud. I love you, and I'm here.",

        "aiQuestion": "Things just went badly between me and my child — how do I repair it?"
      }

  }
  </script>

  <!-- Printable pocket card (hidden on screen; shown only when printing) -->
  <div class="pocket-card" id="rn-pocket" aria-hidden="true"></div>

  <script src="../assets/js/main.js" defer></script>
  <script src="../assets/js/gms-tools.js" defer></script>
  <script>
  (function () {
    var DATA = JSON.parse(document.getElementById('router-data').textContent);
    var main = document.getElementById('rn-main');
    var pocket = document.getElementById('rn-pocket');
    function byId(id) { return DATA.situations.filter(function (s) { return s.id === id; })[0]; }
    function GMSready(fn) { if (window.GMS) fn(); else document.addEventListener('DOMContentLoaded', fn); }

    function el(tag, attrs, kids) {
      var n = document.createElement(tag);
      if (attrs) Object.keys(attrs).forEach(function (k) {
        if (k === 'class') n.className = attrs[k];
        else if (k === 'text') n.textContent = attrs[k];
        else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), attrs[k]);
        else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
      });
      (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return n;
    }

    function renderStart() {
      pocket.innerHTML = '';
      main.innerHTML = '';
      var step = el('div', { class: 'rn-step' }, [
        el('p', { class: 'rn-step__eyebrow', text: 'It\'s hard right now' }),
        el('h1', { class: 'rn-step__title', text: 'What\'s happening?' })
      ]);
      var choices = el('div', { class: 'rn-choices' });
      DATA.situations.forEach(function (s) {
        choices.appendChild(el('button', {
          type: 'button', class: 'rn-choice',
          onclick: function () { renderAnswer(s.id); }
        }, [
          document.createTextNode(s.choice),
          el('span', { class: 'rn-choice__hint', text: s.hint })
        ]));
      });
      step.appendChild(choices);
      main.appendChild(step);
      var h1 = step.querySelector('h1'); if (h1) h1.setAttribute('tabindex', '-1');
      if (h1) h1.focus({ preventScroll: true });
    }

    function actionRow(s) {
      var key = 'right-now:' + s.id;
      var row = el('div', { class: 'rn-actions', role: 'group', 'aria-label': 'Save, listen, or ask' });

      // Save
      function saveLabel() { return (window.GMS && GMS.shelf.has(key)) ? 'Saved ✓' : 'Save this'; }
      var save = el('button', { type: 'button', class: 'btn btn--ghost', text: saveLabel() });
      save.addEventListener('click', function () {
        if (!window.GMS) return;
        if (GMS.shelf.has(key)) GMS.shelf.removeByKey(key);
        else GMS.shelf.add({ key: key, toolSlug: 'right-now', toolTitle: 'It\'s hard right now',
          toolUrl: '/tools/right-now', title: s.title, body: s.body, tryLine: s.tryLine });
        save.textContent = saveLabel();
      });
      row.appendChild(save);

      // Listen
      if (window.GMS && GMS.speechSupported) {
        var speaking = false;
        var listen = el('button', { type: 'button', class: 'btn btn--ghost', text: 'Listen' });
        var text = [s.title, s.body, s.seq.join('. '), 'Try saying: ' + s.tryLine].join('. ');
        listen.addEventListener('click', function () {
          if (speaking) { GMS.stopSpeaking(); speaking = false; listen.textContent = 'Listen'; return; }
          if (GMS.speak(text, function () { speaking = false; listen.textContent = 'Listen'; })) { speaking = true; listen.textContent = 'Stop'; }
        });
        row.appendChild(listen);
      }

      // Ask AI
      var ask = el('a', { class: 'btn btn--ghost', href: (window.GMS ? GMS.askUrl(s.aiQuestion) : '/tools/growing-minds-ai') , text: 'Ask about this' });
      row.appendChild(ask);

      // Print pocket card
      var print = el('button', { type: 'button', class: 'btn btn--ghost', text: 'Print pocket card' });
      print.addEventListener('click', function () {
        fillPocket(s);
        if (window.GMS && GMS.printCard) GMS.printCard(); else window.print();
      });
      row.appendChild(print);

      return row;
    }

    function fillPocket(s) {
      pocket.innerHTML = '';
      pocket.appendChild(el('h2', { text: s.title }));
      var ol = el('ul', { class: 'pocket-seq' });
      s.seq.forEach(function (line, i) { ol.appendChild(el('li', { text: (i + 1) + '. ' + line })); });
      pocket.appendChild(ol);
      pocket.appendChild(el('div', { class: 'pocket-try', text: 'Try saying: ' + s.tryLine }));
      pocket.appendChild(el('p', { class: 'pocket-foot', text: 'Growing Minds Science · growingmindsscience.com' }));
    }

    function renderAnswer(id) {
      var s = byId(id);
      if (!s) return renderStart();
      fillPocket(s);
      main.innerHTML = '';

      var seq = el('ol', { class: 'rn-seq' });
      s.seq.forEach(function (line) {
        seq.appendChild(el('li', {}, [el('b', { 'aria-hidden': 'true', text: '·' }), document.createTextNode(line)]));
      });

      var card = el('div', { class: 'rn-answer' }, [
        el('p', { class: 'rn-answer__state', text: s.state }),
        el('h1', { class: 'rn-answer__title', text: s.title, tabindex: '-1' }),
        el('p', { class: 'rn-answer__body', text: s.body }),
        seq,
        el('div', { class: 'rn-answer__try' }, [el('strong', { text: 'Try: ' }), document.createTextNode(s.tryLine)]),
        actionRow(s),
        el('details', { class: 'rn-why' }, [
          el('summary', { text: 'Read the full tool' }),
          el('p', { class: 'rn-why__body' }, [
            'This is the short version for the hard moment. ',
            el('a', { href: '/tools/' + s.toolSlug, text: 'Open the full guide →' })
          ])
        ])
      ]);
      main.appendChild(card);

      var back = el('div', { class: 'rn-back' }, [
        el('button', { type: 'button', class: 'gms-link', text: '← Something else is happening', onclick: renderStart })
      ]);
      main.appendChild(back);

      var title = card.querySelector('.rn-answer__title');
      if (title) title.focus({ preventScroll: true });
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    GMSready(renderStart);
  })();
  </script>
