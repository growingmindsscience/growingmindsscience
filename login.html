<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Growing Minds Science</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#6F8F7B" />
  <meta name="color-scheme" content="light dark" />
  <!-- Sign-in now lives in the Number Path app (one Supabase identity across
       the site). Bounce there; JS handles it instantly, meta refresh is the
       no-JS fallback. -->
  <meta http-equiv="refresh" content="0; url=/nsc/login" />
  <link rel="canonical" href="https://growingmindsscience.com/nsc/login" />
  <link rel="icon" type="image/png" href="assets/img/original-logo-mark-no-words-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&display=swap" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/refresh.css" />
  <script>location.replace('/nsc/login');</script>
</head>
<body>
  <main id="main" class="auth-page">
    <div class="container container--narrow" style="text-align:center; padding:var(--space-16) 0;">
      <p class="eyebrow">Member access</p>
      <h1>Taking you to sign in…</h1>
      <p class="lede">If you're not redirected, <a href="/nsc/login">go to sign in</a>.</p>
    </div>
  </main>
</body>
</html>
