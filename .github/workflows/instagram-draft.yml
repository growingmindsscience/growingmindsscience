name: instagram-draft

# Keeps the Instagram queue full (marketing/instagram/scripts/draft.mjs). When a
# posting slot inside the next ten days is empty, it drafts posts for every empty
# slot out to seventeen days from the site's collected research, gates and
# critiques each one, queues the ones that pass as approved, commits them to main
# and opens a batch issue where Matthew can hold any post before it publishes.
# Runs three times a day; with nothing to draft it stops after a few seconds.
# Mondays it also writes the weekly readout. See marketing/instagram/README.md,
# "Phase 4: the automated loop".

on:
  schedule:
    - cron: "23 11,17,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Draft every empty slot in the horizon now, even outside the trigger window"
        type: boolean
        default: false
      limit:
        description: "Most posts to draft this run (blank: automation.json)"
        type: string
        default: ""

concurrency:
  group: instagram-draft
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  draft:
    name: draft empty slots
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Anything to draft?
        id: due
        run: |
          out=$(node marketing/instagram/scripts/draft.mjs --check ${{ inputs.force && '--force' || '' }} 2>&1 | tail -1)
          echo "$out"
          if echo "$out" | grep -q "^draft: due"; then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "due=false" >> "$GITHUB_OUTPUT"; fi

      - name: Weekly readout (Mondays)
        if: always()
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          f="marketing/instagram/readouts/$(date -u +%F).md"
          if [ "$(date -u +%u)" = "1" ] && [ ! -f "$f" ] && [ -n "$IG_ACCESS_TOKEN" ]; then
            node marketing/instagram/scripts/insights.mjs --readout || echo "::warning::readout not written"
          fi

      - name: Claude Code and a browser
        if: steps.due.outputs.due == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Draft
        if: steps.due.outputs.due == 'true'
        env:
          # Either credential works: a Claude subscription token from `claude setup-token`,
          # or an Anthropic API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No Claude credential. Run 'claude setup-token' and save it as the CLAUDE_CODE_OAUTH_TOKEN repository secret."
            exit 1
          fi
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          node marketing/instagram/scripts/insights.mjs || echo "::warning::insights not refreshed; drafting from the last numbers"
          node marketing/instagram/scripts/draft.mjs --summary "$RUNNER_TEMP/batch.md" \
            ${{ inputs.force && '--force' || '' }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # Runs even when the draft step failed partway: posts that passed are already
      # written and on the calendar, and the readout may have changed.
      - name: Commit and open the batch issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "instagram-draft"
          git config user.email "noreply@growingmindsscience.com"
          git add marketing/instagram/calendar.json marketing/instagram/posts marketing/instagram/insights.json marketing/instagram/readouts
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Instagram: drafted batch and numbers ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin main
          git push origin HEAD:main
          if [ -s "$RUNNER_TEMP/batch.md" ] && grep -q 'Hold `' "$RUNNER_TEMP/batch.md"; then
            gh label create instagram-batch --color 2E5E4E --description "Automated Instagram batch: tick Hold to stop a post" 2>/dev/null || true
            gh issue create --title "Instagram batch, $(date -u '+%B %-d')" --label instagram-batch --body-file "$RUNNER_TEMP/batch.md"
          fi
