name: instagram-publish

# Publishes approved, due Instagram posts (marketing/instagram/calendar.json) through
# the Graph API, then commits the updated calendar, ledger and bio-link landing page.
# Runs hourly through the posting day (14:00 to 01:00 UTC covers 10:00 to 21:00 Eastern
# in both halves of the year). With nothing due it exits 0 and touches nothing, so a
# fork or a checkout without secrets is safe. See marketing/instagram/README.md, "Operating".

on:
  schedule:
    - cron: "0 0-1,14-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only; no uploads, no API calls"
        type: boolean
        default: true

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: publish due posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Anything due?
        id: due
        run: |
          out=$(node marketing/instagram/scripts/publish.mjs --dry-run 2>&1 | tail -1)
          echo "$out"
          if echo "$out" | grep -q "^nothing due"; then echo "due=false" >> "$GITHUB_OUTPUT"; else echo "due=true" >> "$GITHUB_OUTPUT"; fi

      - name: Browser and ffmpeg for rendering (bundled Chromium)
        if: steps.due.outputs.due == 'true'
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }

      - name: Publish
        if: steps.due.outputs.due == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Reels are voiced and scored at publish time (render-reel.mjs). Without
          # this secret a reel renders silent, fails its check and is skipped.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node marketing/instagram/scripts/publish.mjs --dry-run
          else
            node marketing/instagram/scripts/publish.mjs
          fi

      # Runs even when a post failed: any post that did go out is already marked
      # published in calendar.json, and losing that record would post it again.
      - name: Commit the records
        if: always() && steps.due.outputs.due == 'true'
        run: |
          git config user.name "instagram-publish"
          git config user.email "noreply@growingmindsscience.com"
          git add marketing/instagram/calendar.json marketing/instagram/ledger.json from-instagram.html
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Instagram: record published posts ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin main
          git push origin HEAD:main
