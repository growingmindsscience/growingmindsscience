# Netlify configuration for Growing Minds Science
# Static site — no build step needed.

[build]
  publish = "."

# Pretty URL: /milestones -> standalone static tracker.
[[redirects]]
  from = "/milestones"
  to = "/milestones.html"
  status = 200

[[redirects]]
  from = "/milestones/"
  to = "/milestones.html"
  status = 200

# Pretty URL: /classes/toddlerhood -> flagship class detail page.
[[redirects]]
  from = "/classes/toddlerhood"
  to = "/classes/toddlerhood.html"
  status = 200

[[redirects]]
  from = "/classes/toddlerhood/"
  to = "/classes/toddlerhood.html"
  status = 200

[[redirects]]
  from = "/tools/limits-without-escalation"
  to = "/tools/limits-without-escalation.html"
  status = 200

[[redirects]]
  from = "/tools/limits-without-escalation/"
  to = "/tools/limits-without-escalation.html"
  status = 200

[[redirects]]
  from = "/tools/whats-underneath-the-meltdown"
  to = "/tools/whats-underneath-the-meltdown.html"
  status = 200

[[redirects]]
  from = "/tools/whats-underneath-the-meltdown/"
  to = "/tools/whats-underneath-the-meltdown.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/thank-you/"
  to = "/thank-you.html"
  status = 200

# Pretty URLs for directory hub pages (no-trailing-slash variants).
[[redirects]]
  from = "/classes"
  to = "/classes/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/tools"
  to = "/tools/index.html"
  status = 200

[[redirects]]
  from = "/articles"
  to = "/articles/index.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq/index.html"
  status = 200

# Netlify Forms is enabled automatically when a form has data-netlify="true".
# Forms used on this site:
#   - waitlist            (homepage and class-page waitlist)
# To send notifications:
#   Site → Forms → waitlist → Form notifications → Email notification
#   Recipient: growingmindsscience@gmail.com

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"
