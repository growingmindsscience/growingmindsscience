<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="tg-title tg-desc">
  <title id="tg-title">Growing Minds Science parent tools</title>
  <desc id="tg-desc">Abstract illustration of a small library of parent reference cards linked by a developmental guidance path with milestone markers.</desc>
  <defs>
    <linearGradient id="tg-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FBFDFC"/>
    </linearGradient>
    <linearGradient id="tg-sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7A77"/><stop offset="1" stop-color="#1E5F62"/>
    </linearGradient>
    <radialGradient id="tg-ripple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.62" stop-color="#CFE3DE" stop-opacity="0"/>
      <stop offset="0.63" stop-color="#CFE3DE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#CFE3DE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft tidepool ripples behind -->
  <circle cx="470" cy="300" r="250" fill="url(#tg-ripple)"/>
  <circle cx="470" cy="300" r="190" fill="url(#tg-ripple)"/>

  <!-- guidance path with milestone markers -->
  <path d="M96 556 C 250 500, 360 596, 470 560 C 600 518, 700 588, 812 506" fill="none"
        stroke="#DE7356" stroke-width="11" stroke-linecap="round"/>
  <path d="M96 556 C 250 500, 360 596, 470 560 C 600 518, 700 588, 812 506" fill="none"
        stroke="#C75E44" stroke-width="11" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.55"/>
  <g>
    <circle cx="172" cy="529" r="11" fill="#FBFDFC" stroke="#A3492E" stroke-width="4"/>
    <circle cx="470" cy="560" r="11" fill="#FBFDFC" stroke="#5E9C97" stroke-width="4"/>
    <circle cx="744" cy="536" r="11" fill="#FBFDFC" stroke="#1E5F62" stroke-width="4"/>
  </g>

  <!-- LEFT card: milestones (checklist) -->
  <g transform="translate(96 150) rotate(-5 130 175)">
    <ellipse cx="135" cy="362" rx="120" ry="20" fill="#0E2A2D" opacity="0.06"/>
    <rect x="0" y="0" width="262" height="346" rx="20" fill="url(#tg-card)" stroke="#D4E0DC" stroke-width="2.5"/>
    <g transform="translate(28 30)">
      <rect width="46" height="46" rx="12" fill="#EAF3EF"/>
      <path d="M12 32 C 18 22, 28 20, 34 14" fill="none" stroke="#1E5F62" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="12" cy="32" r="3.4" fill="#1E5F62"/><circle cx="34" cy="14" r="3.4" fill="#DE7356"/>
    </g>
    <rect x="90" y="38" width="120" height="11" rx="5.5" fill="#15393C"/>
    <rect x="90" y="58" width="86" height="8" rx="4" fill="#D4E0DC"/>
    <g transform="translate(30 116)">
      <g><circle cx="11" cy="11" r="11" fill="#EAF3EF"/><path d="M6 11 l3.4 3.6 L17 7" fill="none" stroke="#1E5F62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="5" width="160" height="9" rx="4.5" fill="#D4E0DC"/></g>
      <g transform="translate(0 44)"><circle cx="11" cy="11" r="11" fill="#EAF3EF"/><path d="M6 11 l3.4 3.6 L17 7" fill="none" stroke="#1E5F62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="5" width="132" height="9" rx="4.5" fill="#DDE9E4"/></g>
      <g transform="translate(0 88)"><circle cx="11" cy="11" r="11" fill="#EEF4F1" stroke="#D4E0DC" stroke-width="2"/><rect x="34" y="5" width="150" height="9" rx="4.5" fill="#DDE9E4"/></g>
      <g transform="translate(0 132)"><circle cx="11" cy="11" r="11" fill="#EEF4F1" stroke="#D4E0DC" stroke-width="2"/><rect x="34" y="5" width="116" height="9" rx="4.5" fill="#DDE9E4"/></g>
    </g>
  </g>

  <!-- RIGHT card: guidance (sage, list with dots) -->
  <g transform="translate(556 184) rotate(5 120 160)">
    <ellipse cx="125" cy="338" rx="118" ry="20" fill="#0E2A2D" opacity="0.06"/>
    <rect x="0" y="0" width="258" height="322" rx="20" fill="url(#tg-sage)"/>
    <g transform="translate(28 30)">
      <rect width="46" height="46" rx="12" fill="#FFFFFF" opacity="0.16"/>
      <path d="M11 14 h24 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H22 l-7 7 v-7 h-4 a4 4 0 0 1 -4 -4 V18 a4 4 0 0 1 4 -4 Z" fill="none" stroke="#EAF3EF" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <rect x="90" y="40" width="110" height="11" rx="5.5" fill="#EAF3EF"/>
    <rect x="90" y="60" width="74" height="8" rx="4" fill="#9FC3BA"/>
    <g transform="translate(30 116)">
      <g><circle cx="9" cy="9" r="9" fill="#DE7356"/><rect x="30" y="3" width="168" height="10" rx="5" fill="#EAF3EF"/></g>
      <g transform="translate(0 42)"><circle cx="9" cy="9" r="9" fill="#9FCABF"/><rect x="30" y="3" width="140" height="10" rx="5" fill="#CFE3DE" opacity="0.85"/></g>
      <g transform="translate(0 84)"><circle cx="9" cy="9" r="9" fill="#BFD8D1"/><rect x="30" y="3" width="184" height="10" rx="5" fill="#A6CCC1"/></g>
      <g transform="translate(0 126)"><circle cx="9" cy="9" r="9" fill="#BFD8D1"/><rect x="30" y="3" width="120" height="10" rx="5" fill="#A6CCC1"/></g>
    </g>
  </g>

  <!-- CENTER card: front, growth-rings emblem -->
  <g transform="translate(318 92)">
    <ellipse cx="132" cy="420" rx="150" ry="24" fill="#0E2A2D" opacity="0.08"/>
    <rect x="0" y="0" width="264" height="404" rx="22" fill="url(#tg-card)" stroke="#D4E0DC" stroke-width="2.5"/>
    <g transform="translate(132 150)">
      <circle r="92" fill="#EFF6F2"/>
      <circle r="92" fill="none" stroke="#CFE3DE" stroke-width="2.5"/>
      <circle r="66" fill="none" stroke="#BFD8D1" stroke-width="2.5" stroke-dasharray="4 9"/>
      <circle r="40" fill="none" stroke="#5E9C97" stroke-width="2.5"/>
      <path d="M0 44 C 0 18, 0 2, 0 -28" fill="none" stroke="#1E5F62" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 6 C -22 0, -34 -14, -34 -34 C -10 -32, 2 -16, 0 6 Z" fill="#2E7A77"/>
      <path d="M0 -10 C 22 -16, 36 -30, 38 -52 C 14 -50, -2 -34, 0 -10 Z" fill="#1E5F62"/>
      <circle cx="0" cy="-34" r="6" fill="#DE7356"/>
    </g>
    <rect x="40" y="276" width="150" height="13" rx="6.5" fill="#15393C"/>
    <rect x="40" y="304" width="184" height="9" rx="4.5" fill="#D4E0DC"/>
    <rect x="40" y="322" width="150" height="9" rx="4.5" fill="#D4E0DC"/>
    <rect x="40" y="352" width="92" height="26" rx="13" fill="#EAF3EF"/>
    <rect x="40" y="352" width="92" height="26" rx="13" fill="none" stroke="#8FBDB4" stroke-width="2"/>
    <rect x="56" y="361" width="60" height="8" rx="4" fill="#1E5F62"/>
  </g>

  <!-- small leaf sprig accent, bottom-left -->
  <g transform="translate(60 432)" stroke-linecap="round">
    <path d="M0 60 C 2 36, 0 20, 14 2" stroke="#5E9C97" stroke-width="3.5" fill="none"/>
    <path d="M7 34 C -8 30, -16 20, -16 6 C -2 8, 8 18, 7 34 Z" fill="#CFE3DE"/>
    <path d="M9 20 C 22 16, 30 8, 30 -4 C 18 -2, 8 8, 9 20 Z" fill="#BFD8D1"/>
  </g>
</svg>
